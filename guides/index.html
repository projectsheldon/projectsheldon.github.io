<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guides – Project Sheldon</title>
    <meta name="description" content="Step-by-step guides and tutorials for Project Sheldon.">
    <meta name="theme-color" content="#c7b18f">
    <link rel="icon" href="../favicon/favicon.ico?v=default-2026w40" type="image/x-icon">
    <link rel="apple-touch-icon" href="../favicon/apple-touch-icon.png?v=default-2026w40">
    <link rel="canonical" href="https://www.projectsheldon.me/guides/">
    <!-- Open Graph – kept byte-identical to the rest of the site so every shared
         link renders the same card. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Project Sheldon">
    <meta property="og:title" content="Project Sheldon – Advanced Roblox Development">
    <meta property="og:description" content="A feature-rich, actively maintained developer tool for Roblox.">
    <meta property="og:url" content="https://www.projectsheldon.me/guides/">
    <meta property="og:image" content="https://www.projectsheldon.me/favicon/og-image.png?v=default-2026w40">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Project Sheldon – Advanced Roblox Development">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Project Sheldon – Advanced Roblox Development">
    <meta name="twitter:description" content="A feature-rich, actively maintained developer tool for Roblox.">
    <meta name="twitter:image" content="https://www.projectsheldon.me/favicon/og-image.png?v=default-2026w40">
    <script src="https://cdn.tailwindcss.com?warn=false" onerror="var f=document.createElement('link');f.rel='stylesheet';f.href='../tailwind-fallback.css';document.head.appendChild(f)"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script type="text/javascript" charset="UTF-8" src="https://unpkg.com/highlightjs-luau/dist/luau.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 1) 0%, rgba(5, 5, 5, 1) 100%);
            z-index: -2;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .guide-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(199, 177, 143, 0.35);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(199, 177, 143, 0.12);
        }

        .chip {
            font-size: 0.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a3a3a3;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            white-space: nowrap;
        }

        .chip:hover { color: white; border-color: rgba(255, 255, 255, 0.25); }
        .chip.active {
            background: rgba(199, 177, 143, 0.12);
            border-color: rgba(199, 177, 143, 0.4);
            color: #c7b18f;
        }

        /* ---- reader typography ---- */
        .guide-body { font-size: 0.95rem; line-height: 1.75; color: #d4d4d4; }
        /* First/last child must not carry block margins – otherwise the card
           shows a big empty gap above the first line and below the last one. */
        .guide-body > :first-child { margin-top: 0 !important; }
        .guide-body > :last-child { margin-bottom: 0 !important; }
        .guide-body h1, .guide-body h2, .guide-body h3, .guide-body h4 {
            color: white; font-weight: 800; letter-spacing: -0.01em;
            margin: 1.8em 0 0.6em; line-height: 1.3;
        }
        .guide-body h1 { font-size: 1.7rem; }
        .guide-body h2 { font-size: 1.35rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .guide-body h3 { font-size: 1.1rem; color: #c7b18f; }
        .guide-body p { margin: 0.9em 0; }
        .guide-body a { color: #c7b18f; text-decoration: underline; text-underline-offset: 3px; }
        .guide-body a:hover { color: white; }
        .guide-body ul, .guide-body ol { margin: 0.9em 0; padding-left: 1.5rem; }
        .guide-body li { margin: 0.35em 0; }
        .guide-body ul { list-style: disc; }
        .guide-body ol { list-style: decimal; }
        .guide-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 2em 0; }
        .guide-body img {
            max-width: 100%; border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 1.2em auto; display: block;
            cursor: zoom-in;
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        /* An explicit alignment comes from the editor; centring is the default so
           it never needs an attribute. */
        .guide-body img[data-align="left"] { margin-left: 0; margin-right: auto; }
        .guide-body img[data-align="right"] { margin-left: auto; margin-right: 0; }
        .guide-body img:hover {
            border-color: rgba(199, 177, 143, 0.45);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        }
        .guide-body code {
            font-family: 'JetBrains Mono', monospace; font-size: 0.82em;
            background: rgba(199, 177, 143, 0.1); color: #c7b18f;
            padding: 0.15em 0.45em; border-radius: 0.4rem;
        }
        .guide-body pre {
            background: #0d0d0d; border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1rem; padding: 1.1rem 1.25rem;
            overflow-x: auto; margin: 1.2em 0;
        }
        .guide-body pre code {
            background: none; color: inherit; padding: 0; font-size: 0.82rem; line-height: 1.6;
        }
        .guide-body table {
            width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: 0.85rem;
        }
        .guide-body th, .guide-body td {
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.6rem 0.9rem; text-align: left;
        }
        .guide-body th {
            background: rgba(199, 177, 143, 0.08); color: #c7b18f;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
        }
        .guide-body blockquote {
            border-left: 3px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1.1rem; margin: 1.2em 0;
            background: rgba(255, 255, 255, 0.02); border-radius: 0 0.75rem 0.75rem 0;
            color: #a3a3a3;
        }
        .guide-body blockquote.callout { border-left-width: 3px; }
        .guide-body blockquote.callout-note { border-color: #c7b18f; background: rgba(199,177,143,0.06); }
        .guide-body blockquote.callout-tip { border-color: #22c55e; background: rgba(34,197,94,0.06); }
        .guide-body blockquote.callout-warning { border-color: #f59e0b; background: rgba(245,158,11,0.06); }
        .guide-body blockquote.callout-caution { border-color: #ef4444; background: rgba(239,68,68,0.06); }
        .guide-body .callout-label {
            display: block; font-size: 0.65rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.3rem;
        }
        .guide-body blockquote.callout-note .callout-label { color: #c7b18f; }
        .guide-body blockquote.callout-tip .callout-label { color: #22c55e; }
        .guide-body blockquote.callout-warning .callout-label { color: #f59e0b; }
        .guide-body blockquote.callout-caution .callout-label { color: #ef4444; }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #c7b18f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- image lightbox ---- */
        .glb {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(3, 3, 3, 0.94);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
        }
        .glb[hidden] { display: none; }

        .glb-stage {
            width: 100%; height: 100%;
            overflow: auto; cursor: grab;
            display: flex;
            padding: 24px;
        }
        .glb-stage.grabbing { cursor: grabbing; }

        .glb-img {
            max-width: none; height: auto; display: block;
            /* Without flex:none the flex item shrinks to the stage instead of
               overflowing it, which silently swallowed the zoom. */
            flex: none;
            border-radius: .75rem; box-shadow: 0 20px 60px rgba(0, 0, 0, .7);
            /* Centring is done with auto margins, NOT justify/align-items: a centred
               flex item that overflows is unreachable in the scroll direction it
               overflows towards, so a zoomed image could not be panned. */
            margin: auto;
        }

        .glb-close {
            position: absolute; top: 14px; right: 16px;
            width: 40px; height: 40px; line-height: 1;
            font-size: 26px; color: #d4d4d4;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 999px; cursor: pointer;
            transition: background .2s, color .2s;
        }
        .glb-close:hover { background: rgba(255, 255, 255, .14); color: #fff; }

        .glb-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: .3rem;
            padding: .35rem .5rem;
            background: rgba(16, 16, 18, .72);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: .8rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
        }
        .glb-bar button {
            background: transparent; border: none; color: #d4d4d4;
            font-size: .72rem; font-weight: 800;
            min-width: 2.1rem; padding: .4rem .55rem;
            border-radius: .5rem; cursor: pointer;
        }
        .glb-bar button:hover { background: rgba(255, 255, 255, .1); color: #fff; }
        .glb-pct {
            min-width: 3.4rem; text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: .68rem; font-weight: 700; color: #c7b18f;
        }
        .glb-div { width: 1px; height: 1.2rem; background: rgba(255, 255, 255, .12); margin: 0 .2rem; }

        @media (max-width: 640px) {
            .glb-stage { padding: 12px; }
            .glb-bar { bottom: 10px; }
        }
    </style>
</head>

<body class="antialiased">
    <script src="../js/discord/auth_loading.js"></script>
    <div class="bg-mesh"></div>

    <div id="shared-topbar"></div>

    <main class="max-w-6xl mx-auto px-6 pt-28 pb-20 min-h-screen">
        <!-- list view -->
        <div id="guides-list-view">
            <div class="text-center mb-10">
                <h1 class="text-3xl sm:text-5xl md:text-6xl font-black mb-4 tracking-tighter uppercase" data-i18n="guides.title">Guides</h1>
                <p class="text-neutral-500 text-lg" data-i18n="guides.subtitle">Step-by-step tutorials for Project Sheldon.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 mb-6">
                <input id="guides-search" type="text" placeholder="Search guides…" data-i18n-ph="guides.search"
                    class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder-neutral-600 outline-none focus:border-[#c7b18f]/40 transition-colors">
            </div>
            <div id="guides-cats" class="flex gap-2 flex-wrap mb-8"></div>
            <div id="guides-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="guides-empty" class="hidden text-center text-neutral-500 py-20">
                <div class="text-lg font-bold mb-1" data-i18n="guides.empty.t">No guides found</div>
                <div class="text-sm" data-i18n="guides.empty.s">Try a different search or category.</div>
            </div>
        </div>

        <!-- reader view -->
        <div id="guides-reader-view" class="hidden">
            <a href="./" class="inline-flex items-center gap-2 text-neutral-500 hover:text-white text-sm font-semibold mb-6 transition-colors">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                <span data-i18n="guides.back">All guides</span>
            </a>
            <div id="guide-meta" class="mb-6"></div>
            <article id="guide-body" class="guide-body glass-card rounded-[2rem] p-6 sm:p-10 md:p-12"></article>
        </div>

        <div id="guides-loading" class="flex justify-center py-20">
            <div class="loading-spinner"></div>
        </div>
        <div id="guides-error" class="hidden text-center py-20">
            <div class="text-lg font-bold mb-1 text-red-400" data-i18n="guides.error.t">Couldn't load guides</div>
            <div class="text-sm text-neutral-500 mb-4" data-i18n="guides.error.s">The servers aren't reachable right now.</div>
            <button id="guides-retry" class="bg-white/5 hover:bg-white/10 text-white border border-white/10 rounded-lg px-5 py-2.5 font-bold uppercase text-[10px] tracking-wider transition-all" data-i18n="guides.retry">Retry</button>
        </div>
    </main>

    <div id="shared-footer"></div>

    <script src="../js/html/topbar.js"></script>
    <script src="../js/html/footer.js"></script>
    <script type="module" src="../js/html/guides/index.js"></script>
    <script type="module" src="../js/discord/topbar_buttons.js"></script>
    <script type="module" src="../js/util/redirect.js"></script>
    <script src="../js/util/notify.js"></script>
    <script src="/js/html/bottom-nav.js"></script>
</body>

</html>
