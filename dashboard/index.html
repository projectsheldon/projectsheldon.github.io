    <link

        rel="stylesheet">
    <style>
        /* Dashboard shell mirrors /admin: same surfaces, same hairline dividers,
           same sidebar (brand, search + Ctrl K, group labels, dividers, icon rail). */
        :root {
            --dash-bg: #0b0b0c;
            --dash-panel: #131316;
            --dash-panel-2: #17171b;
            --dash-line: rgba(255, 255, 255, .07);
            --dash-line-2: rgba(255, 255, 255, .13);
            --dash-gold: #c7b18f;
            --dash-text: #ececec;
            --dash-mut: #a3a3a3;
            --dash-dim: #6e6e6e;
            --dash-ok: #34d399;
            --dash-bad: #f87171;
            --dash-warn: #fbbf24;
            --dash-sidebar-w: 240px;
            --dash-rail-w: 64px;
            --dash-topbar-h: 64px;
            --dash-r-sm: 8px;
            --dash-r: 12px;
            --dash-r-lg: 16px;
            --dash-ease: cubic-bezier(.2, .9, .25, 1);
            --dash-focus: rgba(199, 177, 143, .6);
        }

        body {
            background-color: var(--dash-bg);
            color: var(--dash-text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(30, 30, 34, 1) 0%, rgba(11, 11, 12, 1) 70%);
            z-index: -2;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: -1;
            animation: float 20s infinite alternate;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Scoped to the reader on purpose. A global `.hidden { display: none !important }`
           outranks the shared topbar's own `hidden lg:flex` / `hidden lg:inline`
           utilities (both plain `display`), so every desktop nav link and the
           language label silently vanished and left a void in the topbar. */
        .dash-reader .hidden {
            display: none !important;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 2px solid var(--dash-focus);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* ---------- sidebar (ported from /admin) ---------- */
        .dash-sidebar {
            position: fixed;
            top: var(--dash-topbar-h);
            left: 0;
            bottom: 0;
            width: var(--dash-sidebar-w);
            z-index: 90;
            display: flex;
            flex-direction: column;
            padding: 20px 12px 20px;
            background: rgba(15, 15, 17, .82);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            border-right: 1px solid var(--dash-line);
            transition: transform .28s var(--dash-ease), width .25s var(--dash-ease), padding .25s var(--dash-ease);
        }

        /* Command palette, parked in the sidebar exactly like /admin: icon, label
           and the Ctrl K hint inside one pill. */
        .sidebar-search {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
            margin: 0 2px 10px;
            padding: 7px 9px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--dash-line);
            border-radius: 10px;
            color: var(--dash-mut);
            font-family: 'Inter', sans-serif;
            font-size: 12.5px;
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .sidebar-search:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, .22);
            background: rgba(255, 255, 255, .06);
        }

        .sidebar-search svg {
            width: 15px;
            height: 15px;
            flex: none;
            color: var(--dash-dim);
        }

        .sidebar-search-label {
            flex: 1;
            min-width: 0;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-search kbd {
            flex: none;
            font-size: 10px;
            line-height: 1.4;
            font-family: 'JetBrains Mono', monospace;
            color: var(--dash-mut);
            background: rgba(255, 255, 255, .06);
            border: 1px solid var(--dash-line);
            border-radius: 5px;
            padding: 1px 6px;
            white-space: nowrap;
        }

        .sidebar-search:hover kbd {
            color: #fff;
        }

        /* The inline margin cancels the sidebar's own 12px padding, so the nav's
           padding box reaches the sidebar edge. The active gold rail is drawn at
           left:-12px and would otherwise be clipped by the scroll container. */
        .sidebar-nav {
            flex: 1;
            min-height: 0;
            margin-inline: -12px;
            padding-inline: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-group-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #525252;
            padding: 0 .8rem;
            margin: .3rem 0 .35rem;
        }

        .sidebar-divider {
            height: 1px;
            background: var(--dash-line);
            margin: .35rem .4rem .125rem;
        }

        /* Footer carries the collapse control at the sidebar floor, same shape as
           /admin: hairline above it, and it must not shift when the rail narrows.
           1px of inline padding puts the button at x=13 in both states, so
           auto-margins in the rail land on the exact same spot; padding-bottom 0
           leaves the gap below it equal to the sidebar's own top padding. */
        .sidebar-footer {
            margin-top: auto;
            padding: 12px 1px 0;
            border-top: 1px solid var(--dash-line);
        }

        .sidebar-collapse-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--dash-line-2);
            background: rgba(255, 255, 255, .03);
            color: var(--dash-mut);
            cursor: pointer;
            transition: color .15s, border-color .15s, background .15s;
        }

        .sidebar-collapse-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, .25);
            background: rgba(255, 255, 255, .06);
        }

        .sidebar-collapse-btn svg {
            width: 18px;
            height: 18px;
        }

        .sidebar-group {
            display: flex;
            flex-direction: column;
            gap: .125rem;
        }

        .nav-tab {
            border: 0;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
            padding: .5rem .7rem;
            min-height: 34px;
            font-size: .78rem;
            font-weight: 500;
            color: var(--dash-mut);
            letter-spacing: .02em;
            cursor: pointer;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: .65rem;
            position: relative;
            text-decoration: none;
            transition: background .13s, color .13s;
        }

        .nav-tab svg {
            width: 16px;
            height: 16px;
            stroke-width: 1.8;
            flex-shrink: 0;
            opacity: .75;
            transition: opacity .13s, color .13s;
        }

        .nav-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, .05);
        }

        .nav-tab:hover svg {
            opacity: 1;
        }

        .nav-tab.active {
            color: #fff;
            background: rgba(199, 177, 143, .1);
            box-shadow: inset 0 0 0 1px rgba(199, 177, 143, .22);
            font-weight: 600;
        }

        .nav-tab.active svg {
            opacity: 1;
            color: var(--dash-gold);
        }

        /* Gold rail pinned to the sidebar's inner edge, so the active section reads
           as part of the frame rather than a floating pill. */
        .nav-tab.active::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 6px;
            bottom: 6px;
            width: 3px;
            background: var(--dash-gold);
            border-radius: 0 3px 3px 0;
        }


        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .6);
            z-index: 89;
            opacity: 0;
            visibility: hidden;
            transition: opacity .2s, visibility .2s;
        }

        .sidebar-backdrop.show {
            opacity: 1;
            visibility: visible;
        }

        /* ---------- main column ---------- */
        .dash-main {
            margin-left: var(--dash-sidebar-w);
            padding: calc(var(--dash-topbar-h) + 20px) 28px 48px;
            transition: margin-left .25s var(--dash-ease);
        }

        .dash-reader {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dash-reader.is-wide {
            max-width: none;
        }

        /* Tab panels stack their blocks on the same 16px rhythm as the reader,
           otherwise the cards render flush against each other. */
        .dash-tab {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .ta-eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--dash-gold);
            margin: 0 0 .35rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .ta-eyebrow::after {
            content: '';
            height: 1px;
            flex: 0 0 2.2rem;
            background: rgba(199, 177, 143, .35);
        }

        .ta-page-title {
            font-size: 21px;
            font-weight: 700;
            letter-spacing: -.01em;
            color: #fff;
            margin: 0;
            line-height: 1.2;
        }

        .page-sub {
            font-size: 12px;
            color: var(--dash-dim);
            margin: .25rem 0 0;
        }

        /* ---------- panels ---------- */
        .panel {
            background: var(--dash-panel);
            border: 1px solid var(--dash-line);
            border-radius: var(--dash-r-lg);
            padding: 1.1rem 1.2rem;
        }

        .panel--flush {
            padding: 0;
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: .75rem;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .panel-title {
            margin: 0;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #d6d6d6;
            display: flex;
            align-items: center;
            gap: .5rem;
        }

        .panel-title svg {
            width: 14px;
            height: 14px;
            color: var(--dash-gold);
            flex: none;
        }

        .panel-meta {
            font-size: 11px;
            color: var(--dash-dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .panel-tools {
            display: flex;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
        }

        /* Dropdowns use the admin-panel widget (enhanced-select.js): native
           selects are upgraded to the custom trigger + menu, so only the date
           input keeps native styling here – same toolbar look as /admin. */
        .esel .esel-menu {
            width: max-content !important;
            min-width: 0;
            max-width: min(340px, 92vw);
        }

        .esel-option > span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .esel .esel-trigger {
            font-size: .8rem;
        }

        #dash-activity-range + .esel .esel-menu {
            min-width: 190px;
        }

        input[type="date"].stats-select {
            background: rgba(255, 255, 255, .04);
            color: #dcdcdc;
            border: 1px solid var(--dash-line-2);
            border-radius: 9px;
            height: 34px;
            padding: 0 .55rem 0 .7rem;
            font-family: 'Inter', sans-serif;
            font-size: .8rem;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            outline: none;
            color-scheme: dark;
            transition: border-color .15s, background-color .15s;
        }

        input[type="date"].stats-select:hover {
            border-color: rgba(255, 255, 255, .25);
        }

        input[type="date"].stats-select:focus {
            border-color: var(--dash-gold);
        }

        input[type="date"].stats-select::-webkit-calendar-picker-indicator {
            opacity: .5;
            cursor: pointer;
            filter: invert(78%) sepia(18%) saturate(600%) hue-rotate(1deg) brightness(92%);
        }

        input[type="date"].stats-select::-webkit-calendar-picker-indicator:hover {
            opacity: .85;
        }

        .empty {
            padding: 2.2rem 1rem;
            text-align: center;
            color: var(--dash-dim);
            font-size: .82rem;
        }

        /* ---------- stat cards ---------- */
        .dash-stats {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            gap: 16px;
        }

        .dash-stat {
            background: var(--dash-panel);
            border: 1px solid var(--dash-line);
            border-radius: var(--dash-r-lg);
            padding: .85rem 1rem;
            min-width: 0;
            transition: border-color .15s, background .15s;
        }

        .dash-stat:hover {
            background: var(--dash-panel-2);
            border-color: var(--dash-line-2);
        }

        .dash-stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--dash-dim);
            font-weight: 700;
            display: block;
        }

        .dash-stat-value {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.01em;
            margin-top: .2rem;
            color: #fff;
            line-height: 1.2;
        }

        .dash-stat-value.gold {
            color: var(--dash-gold);
        }

        .dash-stat-value.compact {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0;
            margin-top: .45rem;
            white-space: nowrap;
        }

        .dash-stat-sub {
            display: block;
            margin-top: .25rem;
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, .35);
        }

        /* Two facts in one card, split by the same hairline the panels use
           (mirrors /admin's .now-strip). `align-items: start` on the row above
           keeps this card at its own height instead of stretching it to match
           the sparkline card. */
        .dash-stat--split {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            padding: 0;
        }

        .dash-stat-cell {
            display: flex;
            flex-direction: column;
            padding: .85rem 1rem;
            min-width: 0;
        }

        .dash-stat-cell + .dash-stat-cell {
            border-left: 1px solid var(--dash-line);
        }

        .dash-spark {
            display: block;
            width: 100%;
            height: 26px;
            margin-top: .5rem;
        }

        .dash-delta {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-top: .4rem;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .03em;
        }

        /* More usage is the goal here, so "up" gets the brand gold and a drop stays
           quiet instead of raising a false red alarm. */
        .dash-delta.up { color: var(--dash-gold); }
        .dash-delta.down { color: rgba(255, 255, 255, .3); }
        .dash-delta.flat { color: rgba(255, 255, 255, .35); }

        /* ---------- weekly goal (leads the page) ---------- */
        .usage-card {
            position: relative;
            overflow: hidden;
            border-color: rgba(199, 177, 143, .28);
            background:
                linear-gradient(180deg, rgba(199, 177, 143, .09) 0%, rgba(199, 177, 143, 0) 70%),
                var(--dash-panel);
            padding: 1.15rem 1.3rem 1.3rem;
        }

        .usage-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .usage-card-copy {
            min-width: 0;
            flex: 1 1 22rem;
        }

        .usage-ratio {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.01em;
            color: var(--dash-gold);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        /* Doubles as the runner's lane, so it needs real height and a target.
           Borderless lane on purpose: no outline, no inset shadow, no hover
           ring – just the surface the runner lives on. */
        .usage-track {
            position: relative;
            height: 64px;
            background: rgba(255, 255, 255, .05);
            border: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: none;
            cursor: pointer;
            touch-action: manipulation;
        }

        .usage-track:focus,
        .usage-track:focus-visible {
            outline: none;
        }

        .usage-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ab9673 0%, var(--dash-gold) 60%, #d5c39f 100%);
            border-radius: 12px 0 0 12px;
            box-shadow: 0 0 14px rgba(199, 177, 143, .45);
            transition: width .55s var(--dash-ease);
        }

        .usage-runner-canvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .usage-caption {
            font-size: 12.5px;
            color: var(--dash-mut);
            margin: .7rem 0 0;
            line-height: 1.5;
        }

        /* ---------- sparkline tooltip ---------- */
        .dash-spark-wrap {
            display: block;
            margin-top: .55rem;
            border-radius: 6px;
        }

        .dash-spark-wrap:hover {
            background: rgba(255, 255, 255, .03);
        }

        .dash-spark-hint {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: .45rem;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .02em;
            color: rgba(255, 255, 255, .3);
            cursor: help;
        }

        .dash-spark-hint svg {
            width: 11px;
            height: 11px;
            flex: none;
        }

        /* ---------- activity ---------- */
        .kpi-strip {
            display: flex;
            border: 1px solid var(--dash-line);
            border-radius: var(--dash-r-lg);
            background: var(--dash-panel);
            overflow: hidden;
        }

        .kpi {
            padding: .7rem .95rem;
            border-right: 1px solid var(--dash-line);
            min-width: 0;
            flex: 1;
        }

        .kpi:last-child {
            border-right: 0;
        }

        .kpi-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--dash-dim);
        }

        .kpi-value {
            display: block;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -.01em;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kpi-value.accent {
            color: var(--dash-gold);
        }

        .kpi-sub {
            display: block;
            font-size: 10.5px;
            color: var(--dash-dim);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats-views {
            display: flex;
            gap: .25rem;
            border-bottom: 1px solid var(--dash-line);
            margin: 16px 0;
            overflow-x: auto;
        }

        .stats-view-tab {
            background: none;
            border: 0;
            border-bottom: 2px solid transparent;
            color: var(--dash-mut);
            font-size: .75rem;
            font-weight: 600;
            padding: .55rem .8rem;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }

        .stats-view-tab:hover {
            color: #fff;
        }

        .stats-view-tab.active {
            color: var(--dash-gold);
            border-bottom-color: var(--dash-gold);
        }

        .stats-chart {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 220px;
            padding-top: 22px;
            position: relative;
        }

        .stats-chart .chart-gridline {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, .05);
            pointer-events: none;
        }

        .stats-chart .chart-gridline-base {
            bottom: 0;
            background: rgba(255, 255, 255, .14);
        }

        .stats-chart .chart-max {
            position: absolute;
            top: 0;
            left: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--dash-mut);
            pointer-events: none;
            z-index: 2;
        }

        .bar-col {
            flex: 1;
            height: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }

        .bar-col .bar {
            width: 100%;
            max-width: 36px;
            min-height: 3px;
            background: linear-gradient(180deg, #e6d5ae 0%, var(--dash-gold) 60%, rgba(199, 177, 143, .45) 100%);
            border-radius: 6px 6px 2px 2px;
            transition: height .45s var(--dash-ease), filter .13s;
        }

        .bar-col:hover .bar {
            filter: brightness(1.25);
        }

        .bar-col .bar.bar-today {
            background: linear-gradient(180deg, #fff7e3 0%, var(--dash-gold) 55%, #a0813d 100%);
            box-shadow: 0 0 14px rgba(199, 177, 143, .35);
        }

        .bar-col .bar.bar-empty {
            background: rgba(255, 255, 255, .1);
        }

        .chart-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .chart-empty svg {
            width: 28px;
            height: 28px;
            color: #4a4a4a;
            margin-bottom: .5rem;
        }

        .chart-axis {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 10px;
            color: #8a8a8a;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .chart-axis span {
            flex: 1;
            min-width: 0;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chart-axis span.is-start {
            text-align: left;
        }

        .chart-axis span.is-end {
            text-align: right;
        }

        .bar-tooltip {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            background: rgba(8, 9, 13, .96);
            border: 1px solid var(--dash-line-2);
            border-radius: 8px;
            padding: 8px 11px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
            opacity: 0;
            visibility: hidden;
            transition: opacity .12s;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
        }

        .bar-tooltip-label {
            font-size: 10px;
            color: var(--dash-mut);
            letter-spacing: .05em;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .bar-tooltip-count {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        .bar-tooltip-sub {
            font-size: 10px;
            color: var(--dash-mut);
            margin-top: 2px;
        }

        .hourly-wrap {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            animation: hourlyIn .2s ease;
        }

        @keyframes hourlyIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        .hourly-back {
            border: 1px solid var(--dash-line-2);
            background: none;
            border-radius: 8px;
            color: var(--dash-mut);
            font-size: .72rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            padding: .3rem .7rem;
            cursor: pointer;
        }

        .hourly-back:hover {
            color: #fff;
            background: rgba(255, 255, 255, .06);
        }

        /* ---------- tables ---------- */
        .dash-table-wrap {
            overflow: auto;
            max-height: calc(100vh - 260px);
        }

        /* Fullscreen table mode: the licenses panel owns the rest of the viewport,
           sticky header up top, the row list scrolls inside it (same trick as the
           admin panel's license table). */
        .panel--fullscreen {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 220px);
        }

        .panel--fullscreen .dash-table-wrap {
            flex: 1;
            min-height: 300px;
            max-height: none;
        }

        .page-head-actions {
            display: flex;
            align-items: center;
            gap: .75rem;
            flex-wrap: wrap;
        }

        /* `.page-head-actions { display: flex }` outranks the UA `[hidden]` rule, so
           state this explicitly instead of relying on Tailwind's preflight. */
        .page-head-actions[hidden] {
            display: none;
        }

        .dash-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .dash-table th {
            text-align: left;
            padding: .7rem .9rem;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--dash-dim);
            background: #151518;
            border-bottom: 1px solid var(--dash-line-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            position: relative;
            user-select: none;
        }

        .dash-table th.is-sticky {
            position: sticky;
            top: 0;
            z-index: 2;
        }

        /* beats `.dash-table th { text-align: left }` on specificity */
        .dash-table th.td-num {
            text-align: right;
        }

        .dash-table th .col-resizer {
            position: absolute;
            right: 0;
            top: 0;
            width: 7px;
            height: 100%;
            cursor: col-resize;
            z-index: 3;
        }

        .dash-table th .col-resizer::after {
            content: '';
            position: absolute;
            right: 2px;
            top: 20%;
            bottom: 20%;
            width: 1px;
            background: rgba(255, 255, 255, .08);
            transition: background .15s, width .15s;
        }

        .dash-table th .col-resizer:hover::after,
        .dash-table th .col-resizer.is-dragging::after {
            background: var(--dash-gold);
            width: 2px;
            right: 2px;
        }

        .dash-table th:last-child .col-resizer {
            display: none;
        }

        .dash-table td {
            padding: .7rem .9rem;
            font-size: .8rem;
            color: #dcdcdc;
            border-bottom: 1px solid var(--dash-line);
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dash-table td:last-child {
            overflow: visible;
        }

        .dash-table tbody tr {
            transition: background .1s;
        }

        .dash-table tbody tr:hover {
            background: rgba(255, 255, 255, .025);
        }

        .dash-table tbody tr:last-child td {
            border-bottom: 0;
        }

        .dash-table .td-mono {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #fff;
        }

        .td-num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .license-status {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            border: 1px solid;
            white-space: nowrap;
        }

        .license-status.active { background: rgba(6, 78, 59, .5); color: #4ade80; border-color: rgba(22, 101, 52, .5); }
        .license-status.expired { background: rgba(69, 10, 10, .5); color: #f87171; border-color: rgba(153, 27, 27, .5); }
        .license-status.banned { background: rgba(69, 10, 10, .5); color: #f87171; border-color: rgba(153, 27, 27, .5); }
        .license-status.disabled { background: rgba(69, 26, 3, .5); color: #facc15; border-color: rgba(161, 98, 7, .5); }

        .copy-btn {
            color: rgba(255, 255, 255, .35);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: color .15s, background .15s;
            background: transparent;
            border: 0;
            display: inline-flex;
            position: relative;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, .07);
        }

        .copy-btn.success {
            color: var(--dash-gold);
            background: rgba(199, 177, 143, .12);
        }

        .copy-btn .check-icon {
            position: absolute;
            opacity: 0;
            transform: scale(.5);
            transition: all .2s ease;
        }

        .copy-btn.success .copy-icon {
            opacity: 0;
            transform: scale(.5);
        }

        .copy-btn.success .check-icon {
            opacity: 1;
            transform: scale(1);
        }

        /* ---------- segmented filter ---------- */
        .dash-filter {
            display: inline-flex;
            gap: 3px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--dash-line);
            border-radius: 10px;
            padding: 3px;
        }

        .dash-filter-btn {
            border: none;
            background: none;
            color: var(--dash-mut);
            font-family: 'Inter', sans-serif;
            font-size: .74rem;
            font-weight: 700;
            padding: .4rem .85rem;
            border-radius: 7px;
            cursor: pointer;
            white-space: nowrap;
            transition: color .15s, background .15s;
        }

        .dash-filter-btn:hover {
            color: #fff;
        }

        .dash-filter-btn.active {
            background: rgba(255, 255, 255, .1);
            color: #fff;
        }

        /* ---------- skeleton ---------- */
        .skel {
            border-radius: 6px;
            background: linear-gradient(90deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, .09), rgba(255, 255, 255, .03));
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
        }

        .skel-bar {
            background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03)) !important;
            background-size: 200% 100% !important;
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* ---------- command palette ---------- */
        .cmdp-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 14vh 16px 16px;
        }

        .cmdp-overlay.show {
            display: flex;
        }

        .cmdp {
            width: 100%;
            max-width: 560px;
            background: #0d0d0d;
            border: 1px solid var(--dash-line-2);
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
            overflow: hidden;
            animation: cmdpIn .18s ease-out;
        }

        @keyframes cmdpIn {
            from { opacity: 0; transform: translateY(-8px) scale(.98); }
            to { opacity: 1; transform: none; }
        }

        .cmdp-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--dash-line);
        }

        .cmdp-input {
            flex: 1;
            min-width: 0;
            background: transparent;
            border: 0;
            outline: 0;
            color: #fff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
        }

        .cmdp-input::placeholder {
            color: rgba(255, 255, 255, .3);
        }

        .cmdp-kbd {
            font-size: 10px;
            color: rgba(255, 255, 255, .35);
            border: 1px solid var(--dash-line-2);
            border-radius: 5px;
            padding: 2px 6px;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .cmdp-list {
            max-height: 340px;
            overflow-y: auto;
            padding: 6px;
        }

        .cmdp-empty {
            padding: 28px 16px;
            text-align: center;
            color: rgba(255, 255, 255, .4);
            font-size: 13px;
        }

        .cmdp-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
        }

        .cmdp-item.active,
        .cmdp-item:hover {
            background: rgba(199, 177, 143, .1);
        }

        .cmdp-body {
            flex: 1;
            min-width: 0;
        }

        .cmdp-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .6);
            flex-shrink: 0;
        }

        .cmdp-item.active .cmdp-icon {
            background: rgba(199, 177, 143, .15);
            color: var(--dash-gold);
        }

        .cmdp-title {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .cmdp-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, .4);
            margin-top: 1px;
        }

        .cmdp-kbd-enter {
            margin-left: auto;
            color: rgba(255, 255, 255, .3);
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }

        /* ---------- footer offset ---------- */
        .site-footer {
            margin-left: var(--dash-sidebar-w);
            transition: margin-left .25s var(--dash-ease);
        }

        /* ---------- mobile drawer ---------- */
        .dash-drawer-btn {
            display: none;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            flex-shrink: 0;
            border-radius: 10px;
            border: 1px solid var(--dash-line-2);
            background: rgba(255, 255, 255, .03);
            color: var(--dash-mut);
            cursor: pointer;
        }

        .dash-drawer-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Desktop collapsed = slim icon rail, exactly like /admin: only the width
           and the label visibility change, the footer button just flips its icon. */
        @media (min-width: 901px) {
            .sidebar-backdrop {
                display: none;
            }

            .dash-sidebar.collapsed {
                width: var(--dash-rail-w);
                padding-left: .55rem;
                padding-right: .55rem;
            }

            .dash-sidebar.collapsed .sidebar-search,
            .dash-sidebar.collapsed .sidebar-group-label,
            .dash-sidebar.collapsed .nav-label {
                display: none !important;
            }

            .dash-sidebar.collapsed .nav-tab {
                justify-content: center;
                padding: .5rem;
            }

            /* the rail is narrower, so the active marker tracks its own padding */
            .dash-sidebar.collapsed .nav-tab.active::before {
                left: -8.8px;
            }

            .dash-sidebar.collapsed .sidebar-nav {
                margin-inline: -.55rem;
                padding-inline: .55rem;
            }

            /* auto margins split the rail's leftover half pixel, so the gaps match */
            /* auto margins land the button on the same x the expanded sidebar uses; the
               negative right margin hands back the pixel the sidebar's 1px border
               takes, the same trick the nav uses to reach the edge. */
            .dash-sidebar.collapsed .sidebar-footer {
                margin-right: -1px;
            }

            .dash-sidebar.collapsed .sidebar-collapse-btn {
                margin-inline: auto;
            }

            .dash-sidebar.collapsed .sidebar-collapse-btn svg {
                transform: scaleX(-1);
            }
        }

        body.drawer-open {
            overflow: hidden;
        }

        @media (prefers-reduced-motion: reduce) {
            .bar-col .bar { transition: none; }
            .hourly-wrap { animation: none; }
        }

        @media (max-width: 900px) {
            .dash-sidebar {
                transform: translateX(-100%);
                box-shadow: none;
                width: var(--dash-sidebar-w);
            }

            .dash-sidebar.open {
                transform: none;
                box-shadow: 24px 0 60px rgba(0, 0, 0, .5);
            }

            .dash-main {
                margin-left: 0;
                padding: calc(var(--dash-topbar-h) + 20px) 16px 40px;
            }

            .panel--fullscreen {
                min-height: 0;
            }

            .panel--fullscreen .dash-table-wrap {
                min-height: 0;
            }

            .site-footer {
                margin-left: 0;
            }

            .dash-drawer-btn {
                display: inline-flex;
            }

            .dash-table-wrap {
                max-height: none;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .cmdp-overlay { padding-top: 10vh; }
        }

        @media (max-width: 560px) {
            .dash-stats { grid-template-columns: 1fr; }
            .kpi-strip { flex-wrap: wrap; }
            .kpi { flex: 1 1 50%; border-bottom: 1px solid var(--dash-line); }
        }
    </style>
</head>

        <div class="sidebar-footer">
            <button type="button" id="dash-sidebar-toggle" class="sidebar-collapse-btn" title="Collapse sidebar" aria-label="Collapse sidebar" aria-controls="dash-sidebar" aria-expanded="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>

    </aside>

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>

                        <div class="usage-card-copy">
                            <p class="panel-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                                Free license goal
                            </p>
                            <p class="usage-caption" id="dash-usage-caption"></p>
                        </div>
                        <p class="usage-ratio"><span id="dash-usage-ratio">0 / 10 hours</span></p>
                    </div>
                    <div class="usage-track" id="dash-usage-track" tabindex="0" aria-describedby="dash-usage-caption" title="Click or press space to jump, hold or press down to duck">
                        <div class="usage-fill" id="dash-usage-fill"></div>
                        <canvas class="usage-runner-canvas" id="dash-usage-canvas" aria-hidden="true"></canvas>
                    </div>
                    <div id="dash-usage-action" style="display:none;margin-top:12px;"></div>
                </div>

                <div class="dash-stats" id="dash-stats">
                    <div class="dash-stat">
                        <div class="skel" style="width:58%;height:10px;"></div>
                        <div class="skel" style="width:75%;height:22px;margin-top:10px;"></div>
                        <div class="skel" style="width:100%;height:26px;margin-top:8px;"></div>
                    </div>
                    <div class="dash-stat dash-stat--split">
                        <div class="dash-stat-cell">
                            <div class="skel" style="width:55%;height:10px;"></div>
                            <div class="skel" style="width:70%;height:22px;margin-top:10px;"></div>
                        </div>
                        <div class="dash-stat-cell">
                            <div class="skel" style="width:62%;height:10px;"></div>
                            <div class="skel" style="width:78%;height:22px;margin-top:10px;"></div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-head">
                        <div style="min-width:0;">
                            <h3 class="panel-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                                Activity
                            </h3>
                            <p class="panel-meta" id="dash-activity-date-range" style="margin-top:.35rem;">No data yet.</p>
                        </div>
                        <div class="panel-tools">
                            <select id="dash-activity-range" class="stats-select" aria-label="Activity range">
                                <option value="1">1 day</option>
                                <option value="3">3 days</option>
                                <option value="7">1 week</option>
                                <option value="14" selected>2 weeks</option>
                                <option value="30">1 month</option>
                                <option value="90">3 months</option>
                                <option value="365">Year</option>
                                <option value="all">All</option>
                            </select>
                            <input type="date" id="dash-activity-end" class="stats-select" data-native aria-label="End date" style="max-width:9.5rem">
                        </div>
                    </div>

                    <div class="kpi-strip" id="dash-activity-kpis"></div>

                    <div class="stats-views" role="tablist" aria-label="Activity view">
                        <button class="stats-view-tab active" data-mode="daily" role="tab" aria-selected="true">Daily</button>
                        <button class="stats-view-tab" data-mode="weekly" role="tab" aria-selected="false">Weekly</button>
                        <button class="stats-view-tab" data-mode="cumulative" role="tab" aria-selected="false">Cumulative</button>
                    </div>

                    <div id="dash-activity-chart"></div>
                </div>

            </div>

            <!-- Licenses tab -->
            <div id="tab-licenses" class="dash-tab hidden">
                <div class="panel panel--flush panel--fullscreen">
                    <div id="dash-license-list" class="dash-table-wrap">
                        <table class="dash-table" style="min-width:760px;">
                            <thead>
                                <tr>
                                    <th class="is-sticky">Key</th><th class="is-sticky">Product</th><th class="is-sticky">Status</th><th class="is-sticky td-num">Expires</th><th class="is-sticky td-num">Created</th><th class="is-sticky td-num">Last activity</th><th class="is-sticky"></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td><div class="skel" style="width:90%;height:12px;"></div></td><td><div class="skel" style="width:70%;height:12px;"></div></td><td><div class="skel" style="width:50%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td></td></tr>
                                <tr><td><div class="skel" style="width:80%;height:12px;"></div></td><td><div class="skel" style="width:65%;height:12px;"></div></td><td><div class="skel" style="width:50%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td></td></tr>
                                <tr><td><div class="skel" style="width:85%;height:12px;"></div></td><td><div class="skel" style="width:70%;height:12px;"></div></td><td><div class="skel" style="width:50%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td><div class="skel" style="width:60%;height:12px;"></div></td><td></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Command palette -->
    <div class="cmdp-overlay" id="commandPalette" aria-hidden="true">
        <div class="cmdp" role="dialog" aria-label="Command palette">
            <div class="cmdp-input-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:rgba(255,255,255,0.35);flex-shrink:0;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input class="cmdp-input" id="cmdpInput" placeholder="Search actions, license keys…" autocomplete="off" spellcheck="false" aria-label="Command palette search">
                <span class="cmdp-kbd">ESC</span>
            </div>
            <div class="cmdp-list" id="cmdpList"></div>
        </div>
    </div>

    <div id="shared-footer"></div>

    <script src="../js/html/render/canvas.js"></script>
    <script src="/js/html/topbar.js"></script>
    <script src="/js/html/footer.js"></script>
    <script type="module" src="../js/html/dashboard/index.js"></script>
    <script src="../js/html/dashboard/command-palette.js"></script>
    <script src="../js/util/notify.js"></script>
    <script type="module" src="../js/discord/topbar_buttons.js"></script>
    <script type="module" src="../js/util/redirect.js"></script>

</body>

</html>
