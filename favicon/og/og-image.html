<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sheldon OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0;background:#08080a}
.card{width:1200px;height:630px;box-sizing:border-box;position:relative;overflow:hidden;background:#08080a;font-family:Inter,system-ui,sans-serif;color:#f5f1ea}
.wall{position:absolute;left:-320px;top:-330px;width:1860px;display:flex;flex-direction:column;gap:10px;transform:rotate(-9deg);filter:blur(1.2px);opacity:.5}
.row{display:flex;align-items:center}
.tag{flex-shrink:0;border-radius:999px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:#767067;background:#141417}
.tag.hot{font-weight:700;color:#e2b05a;background:rgba(226,176,90,.10)}
.dim{position:absolute;inset:0;background:radial-gradient(ellipse 520px 300px at 50% 50%,rgba(8,8,10,.82) 0%,rgba(8,8,10,.25) 70%,rgba(8,8,10,.15) 100%)}
.vignette{position:absolute;inset:0;box-shadow:inset 0 0 90px 10px rgba(8,8,10,.8)}
.center{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.logo{width:104px;height:104px;filter:drop-shadow(0 0 26px rgba(226,176,90,.4))}
.word{font-weight:800;font-size:104px;line-height:.9;letter-spacing:.02em}
.badges{display:flex;gap:12px;margin-top:6px}
.badge{display:flex;align-items:center;gap:10px;padding:11px 18px;border-radius:12px;background:#121214;border:1px solid #2a2824;font-weight:600;font-size:20px}
.url{margin-top:8px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:17px;letter-spacing:.24em;color:#e2b05a}
</style>
</head>
<body>
<div class="card">
  <div class="wall" id="wall"></div>
  <div class="dim"></div>
  <div class="vignette"></div>
  <div class="center">
    <img class="logo" src="../seasonal/variants/icon-default-512.png" alt="">
    <div class="word">SHELDON</div>
    <div class="badges">
      <div class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e2b05a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg><span>Undetected</span></div>
      <div class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e2b05a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg><span>Feature-rich</span></div>
      <div class="badge"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e2b05a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 12h4"/><path d="M8 10v4"/><circle cx="15" cy="13" r="1"/><circle cx="18" cy="11" r="1"/></svg><span>Every genre</span></div>
    </div>
    <div class="url">PROJECTSHELDON.ME</div>
  </div>
</div>
<script>
(function () {
    const all = ['SHOOTER', 'TYCOON', 'SIMULATOR', 'RPG', 'OBBY', 'HORROR', 'FIGHTING', 'RACING', 'ROLEPLAY', 'SURVIVAL', 'ANIME', 'SPORTS', 'TOWER DEFENSE', 'BATTLEGROUNDS', 'FPS', 'SANDBOX', 'HEIST', 'ADVENTURE', 'PVP', 'STRATEGY', 'MMO', 'PLATFORMER', 'STEALTH', 'PUZZLE'];
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const wall = document.getElementById('wall');
    for (let r = 0; r < 22; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        const tags = [];
        for (let i = 0; i < 20; i++) {
            const label = all[Math.floor(rnd() * all.length)];
            const hot = rnd() < 0.07;
            const size = 12 + Math.floor(rnd() * 4) * 2;
            const big = size >= 16;
            const op = (0.35 + rnd() * 0.55).toFixed(2);
            const hotOp = (0.45 + rnd() * 0.35).toFixed(2);
            const rot = ((rnd() - 0.5) * 4).toFixed(1);
            const dy = Math.round((rnd() - 0.5) * 14);
            const el = document.createElement('span');
            el.className = hot ? 'tag hot' : 'tag';
            el.textContent = label;
            el.style.cssText = `padding:${big ? '8px 16px' : '6px 13px'};margin-top:${dy}px;font-size:${size}px;font-weight:${hot ? 700 : (big ? 600 : 500)};opacity:${hot ? hotOp : op};transform:rotate(${rot}deg)`;
            tags.push(el);
        }
        const shift = Math.round(rnd() * 180);
        const gap = 10 + Math.round(rnd() * 14);
        row.style.cssText = `gap:${gap}px;padding-left:${shift}px`;
        tags.forEach(t => row.appendChild(t));
        wall.appendChild(row);
    }
})();
</script>
</body>
</html>
