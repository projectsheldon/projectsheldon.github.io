<!doctype html>
<html><head><meta charset="utf-8"><title>Sheldon seasonal emblem options</title>
<style>
  body{background:#0a0a0c;color:#ddd;font-family:'Segoe UI',Arial;margin:0;padding:28px}
  h1{font-size:22px;letter-spacing:2px;text-transform:uppercase;color:#e8b767}
  .season{margin:24px 0}
  .season h2{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#9a9aa4;margin:0 0 12px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .opt{width:196px;background:#141317;border:1px solid #2c2c33;border-radius:12px;padding:14px;text-align:center}
  .ico{width:96px;height:96px;margin:0 auto}
  .ico img{width:96px;height:96px;display:block}
  .n{font-size:13px;margin-top:8px;color:#f0f0f2}
  .c{font-size:11px;color:#7a7a84;font-family:Consolas,monospace;margin-top:2px}
  .st{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:8px}
  .cur{color:#e8b767}
  .alt{color:#63e0bd}
  .lk{margin-top:8px;font-size:11px;line-height:1.7}
  .lk a{color:#6fa8ff;text-decoration:none}
</style></head><body>
<h1>Seasonal emblem candidates</h1>
<div id="w"></div>
<script>
const DATA = {
 newyear: { cur:["1f389","party popper"], opts:[["1f386","fireworks"],["1f387","sparkler"],["1f37e","cork pop"],["1f31f","glowing star"]] },
 valentine: { cur:["1f49d","heart with ribbon"], opts:[["1f48d","ring"],["1f5d3","heart decoration"],["1f498","cupid"],["1f48c","love letter"]] },
 april: { cur:["1f921","clown face"], opts:[["1f0cf","joker card"],["1f978","disguised face"],["1f61c","stuck out tongue"],["1f608","wink"]] },
 easter: { cur:["1f95a","egg"], opts:[["1f98b","butterfly"],["1f430","rabbit"],["1f989","owl"],["1f337","tulip"]] },
 halloween: { cur:["1f383","jack-o-lantern"], opts:[["1f47b","ghost"],["1f480","skull"],["1f52f","crystal ball"],["1f483","woman vampire"]] },
 christmas: { cur:["1f384","christmas tree"], opts:[["1f385","santa"],["1f32d","hot chocolate"],["1f366","socks"],["1f965","pine tree"]] }
};
const w = document.getElementById("w");
const card = (code, name, tag, cls) =>
  '<div class="opt">' +
  '<div class="ico"><img src="https://api.iconify.design/twemoji/' + code + '.svg"></div>' +
  '<div class="n">' + name + '</div>' +
  '<div class="c">U+' + code.toUpperCase() + '</div>' +
  '<div class="st ' + cls + '">' + tag + '</div>' +
  '<div class="lk"><a target="_blank" href="https://api.iconify.design/twemoji/' + code + '.svg">twemoji</a> · ' +
  '<a target="_blank" href="https://api.iconify.design/openmoji/' + code + '.svg">openmoji</a> · ' +
  '<a target="_blank" href="https://emojipedia.org/' + name.replace(/ /g, "-") + '">emojipedia</a></div></div>';

for (const [id, d] of Object.entries(DATA)) {
  const sec = document.createElement("div");
  sec.className = "season";
  sec.innerHTML = "<h2>" + id + "</h2><div class=row>" +
    card(d.cur[0], d.cur[1], "current emblem", "cur") +
    d.opts.map(([c, n]) => card(c, n, "candidate", "alt")).join("") +
    "</div>";
  w.appendChild(sec);
}
</script></body></html>
