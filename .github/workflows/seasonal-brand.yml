name: Seasonal brand assets

on:
  schedule:
    # 03:17 UTC daily. Off-the-hour on purpose so this does not pile onto the
    # top-of-hour GitHub Actions queue with everyone else's cron jobs.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Preview a specific date (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write

concurrency:
  group: seasonal-brand
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Swaps favicon/og-image.png to the current season and rewrites the ?v=
      # stamp on every og:image / twitter:image. The favicon and the in-page logo
      # are the bare mark year round and are never swapped. Both steps are
      # no-ops when nothing changed, so the commit below is skipped for the
      # ~360 days a year the art stays the same.
      - name: Point the embed art at the current season
        run: node favicon/seasonal/pick.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }}

      - name: Commit the swap
        run: |
          if git diff --quiet; then
            echo "seasonal assets unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon/og-image.png
          git add "*.html" "*/*.html" "*/*/*.html"
          git commit -m "brand: switch seasonal embed art"
          git pull --rebase --autostash
          git push