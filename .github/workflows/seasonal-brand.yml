name: Seasonal brand assets

on:
  schedule:
    # 03:17 UTC daily. Off-the-hour on purpose so this does not pile onto the
    # top-of-hour GitHub Actions queue with everyone else's cron jobs.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Preview a specific date (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write

concurrency:
  group: seasonal-brand
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Swaps the favicon, touch icon and in-page logo to the current season and
      # stamps ?v= on the icon links. The Discord embed art is never touched.
      # A no-op on most days, so the commit below is usually skipped.
      - name: Point the site icon at the current season
        run: node favicon/seasonal/pick.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }}

      - name: Commit the swap
        run: |
          if git diff --quiet; then
            echo "seasonal icon unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add favicon/favicon.ico favicon/apple-touch-icon.png favicon/icon.png favicon/logo.png
          git add "*.html" "*/*.html" "*/*/*.html"
          git commit -m "brand: switch seasonal icon"
          git pull --rebase --autostash
          git push