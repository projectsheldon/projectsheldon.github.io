    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .bg-mesh {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(20, 20, 20, 1) 0%, rgba(5, 5, 5, 1) 100%);
            z-index: -2;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: -1;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 40px); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glitch {
            0%, 85%, 100% { transform: translate(0); clip-path: inset(0); }
            86% { transform: translate(-4px, 2px); clip-path: inset(20% 0 60% 0); }
            88% { transform: translate(4px, -1px); clip-path: inset(50% 0 10% 0); }
            90% { transform: translate(-2px, -2px); clip-path: inset(10% 0 70% 0); }
            92% { transform: translate(2px, 1px); clip-path: inset(70% 0 5% 0); }
            94% { transform: translate(-1px, 3px); clip-path: inset(30% 0 40% 0); }
            96% { transform: translate(3px, -2px); clip-path: inset(5% 0 80% 0); }
            98% { transform: translate(0); clip-path: inset(0); }
        }

        @keyframes glitch-slice {
            0%, 90%, 100% { opacity: 0; }
            92% { opacity: 1; transform: translate(8px, -4px); }
            94% { opacity: 0; }
            96% { opacity: 1; transform: translate(-6px, 3px); }
            98% { opacity: 0; }
        }

        @keyframes scanline {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(199, 177, 143, 0.1); }
            50% { border-color: rgba(199, 177, 143, 0.25); }
        }

        @keyframes number-drip {
            0% { transform: translateY(-100%); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.6;
            pointer-events: none;
        }

        .scanline {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(199, 177, 143, 0.12), transparent);
            z-index: 1;
            animation: scanline 3s linear infinite;
            pointer-events: none;
        }

        .hero-animate {
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
        }
        .hero-animate-delay-1 { animation-delay: 0.15s; }
        .hero-animate-delay-2 { animation-delay: 0.3s; }
        .hero-animate-delay-3 { animation-delay: 0.5s; }
        .hero-animate-delay-4 { animation-delay: 0.7s; }

        .glass-nav {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .glitch-number {
            position: relative;
            display: inline-block;
            animation: glitch 4s infinite;
            background: linear-gradient(to bottom, #fff 35%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glitch-ghost {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            animation: glitch-slice 3s infinite;
            background: linear-gradient(to bottom, #c7b18f 35%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: pulse-border 3s infinite;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(199, 177, 143, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 24px 48px -12px rgba(199, 177, 143, 0.2);
        }

        .btn-home {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transition: left 0.6s ease;
        }

        .btn-home:hover::before { left: 100%; }

        .btn-home:hover {
            background: rgba(199, 177, 143, 0.08);
            border-color: rgba(199, 177, 143, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -8px rgba(199, 177, 143, 0.2);
        }

        .btn-home:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-back {
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .logo-box {
            transition: transform 0.3s ease;
        }
        .logo-box:hover { transform: rotate(10deg) scale(1.05); }

        @media (max-width: 640px) {
            .glitch-number { font-size: 6rem !important; }
            .glass-card { padding: 2rem 1.5rem !important; }
        }

    <script>
        const canvas = document.getElementById('particle-canvas');
        let ctx = null;
        let particles = [];
        const particleCount = 120;

        function resize() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.size = Math.random() * 1.8 + 0.2;
                this.opacity = Math.random() * 0.35 + 0.05;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.init();
            }
            draw() {
                ctx.fillStyle = `rgba(199, 177, 143, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            for (let i = 0; i < particleCount; i++) particles.push(new Particle());
            animate();
        }

        function animate() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        window.onload = initParticles;
    </script>
